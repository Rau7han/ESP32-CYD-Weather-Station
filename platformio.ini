[platformio]
src_dir = Esp32_CYD_TFT_eSPI_OpenWeather_LittleFS_v02
data_dir = Esp32_CYD_TFT_eSPI_OpenWeather_LittleFS_v02/data
default_envs = cyd_ili9341

[env:cyd_ili9341]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = no_ota.csv
board_build.filesystem = littlefs
lib_deps =
  https://github.com/Bodmer/TFT_eSPI.git#16e37595040eac69cd628e4bffb56fc30cad6299
  bblanchon/ArduinoJson@7.4.2
  bodmer/TJpg_Decoder@1.1.0
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034
build_flags =
  -D USER_SETUP_LOADED=1
  -D PLATFORMIO=1
  -include $PROJECT_DIR/Setup801_ESP32_CYD_ILI9341_240x320.h
